<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Brain Hub ??? ?????????</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1180" cy="220" r="320" fill="url(#glow)"/>

  <!-- distant hills -->
  <path d="M0 620 C220 540 420 580 640 560 C860 540 1040 480 1280 520 C1420 545 1520 560 1600 540 L1600 1000 L0 1000 Z" fill="#93C5FD" opacity="0.45"/>
  <path d="M0 700 C260 640 480 690 760 660 C1040 630 1260 600 1600 640 L1600 1000 L0 1000 Z" fill="#6366F1" opacity="0.25"/>

  <!-- window frame -->
  <rect x="820" y="120" width="620" height="420" rx="28" fill="url(#window)" stroke="#1E3A8A" stroke-width="10"/>
  <line x1="1130" y1="120" x2="1130" y2="540" stroke="#1E3A8A" stroke-width="8" opacity="0.35"/>
  <line x1="820" y1="330" x2="1440" y2="330" stroke="#1E3A8A" stroke-width="8" opacity="0.35"/>

  <!-- soft sun -->
  <circle cx="1280" cy="220" r="54" fill="#818CF8" opacity="0.85"/>

  <!-- desk -->
  <rect x="120" y="620" width="1040" height="48" rx="12" fill="url(#desk)"/>
  <rect x="180" y="668" width="36" height="180" rx="8" fill="#1E40AF"/>
  <rect x="1040" y="668" width="36" height="180" rx="8" fill="#1E40AF"/>

  <!-- notebook -->
  <rect x="280" y="470" width="280" height="180" rx="16" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="6"/>
  <line x1="320" y1="520" x2="520" y2="520" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
  <line x1="320" y1="560" x2="500" y2="560" stroke="#2563EB" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="320" y1="600" x2="470" y2="600" stroke="#2563EB" stroke-width="6" stroke-linecap="round" opacity="0.45"/>

  <!-- laptop -->
  <rect x="620" y="470" width="340" height="200" rx="18" fill="#0F172A" stroke="#1E3A8A" stroke-width="6"/>
  <rect x="642" y="492" width="296" height="150" rx="10" fill="#DBEAFE"/>
  <rect x="700" y="530" width="180" height="16" rx="8" fill="#2563EB" opacity="0.7"/>
  <rect x="700" y="564" width="120" height="12" rx="6" fill="#1E3A8A" opacity="0.35"/>
  <rect x="600" y="670" width="380" height="22" rx="8" fill="#0F172A"/>

  <!-- books stack -->
  <rect x="1040" y="560" width="160" height="28" rx="6" fill="#6366F1"/>
  <rect x="1055" y="532" width="145" height="28" rx="6" fill="#3B82F6"/>
  <rect x="1068" y="504" width="130" height="28" rx="6" fill="#1D4ED8"/>

  <!-- plant -->
  <rect x="140" y="540" width="28" height="80" rx="8" fill="#64748B"/>
  <ellipse cx="154" cy="500" rx="34" ry="48" fill="#2563EB"/>
  <ellipse cx="180" cy="520" rx="24" ry="36" fill="#1E40AF"/>

  <!-- abstract graph lines -->
  <path d="M670 620 C720 580 760 640 810 590 C860 540 900 610 950 570" stroke="#6366F1" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
</svg>
